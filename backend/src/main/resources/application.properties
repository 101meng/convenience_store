spring.application.name=convenience_store_backend
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${STORE_DB_URL:jdbc:mysql://localhost:3306/convenience_store_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${STORE_DB_USERNAME:root}
spring.datasource.password=${STORE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# Redis 连接配置
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}

# JWT 配置
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:604800000}

# LongCat AI 配置
ai.longcat.api-url=${LONGCAT_API_URL:https://api.longcat.chat/openai/v1/chat/completions}
ai.longcat.model=${LONGCAT_MODEL:LongCat-Flash-Chat}
ai.longcat.api-key=${LONGCAT_API_KEY:}
